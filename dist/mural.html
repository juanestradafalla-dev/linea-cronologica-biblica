.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;mb-data&quot;&gt;{&quot;chronology&quot;:{&quot;titulo&quot;:&quot;De la caída de Lucifer a Jerusalén, 70 d. C.&quot;,&quot;estado&quot;:&quot;Primera estructura de estudio. Cobertura del recorrido completo; desarrollo y cotejo exhaustivo aún en curso.&quot;,&quot;campos&quot;:[&quot;momento&quot;,&quot;evento&quot;,&quot;personajes&quot;,&quot;detalle&quot;,&quot;fuentes&quot;,&quot;observacion&quot;],&quot;etapas&quot;:[{&quot;nombre&quot;:&quot;Rebelión celestial&quot;,&quot;periodo&quot;:&quot;Antes de la creación terrestre; sin fecha cuantificable&quot;,&quot;eventos&quot;:[[&quot;Antecedente&quot;,&quot;Armonía y posición de Lucifer&quot;,&quot;Dios Padre; el Hijo; Lucifer; ángeles&quot;,&quot;PP presenta a Lucifer como querubín cubridor, creado, santo y muy honrado; la armonía se funda en obediencia voluntaria y amor.&quot;,&quot;PP 34.1–35.1; SR 13.1&quot;,&quot;Marco de los libros aportados. Isaías 14:4 y Ezequiel 28:12 nombran a los reyes de Babilonia y Tiro; su aplicación a Lucifer debe identificarse como interpretación.&quot;],[&quot;Inicio del conflicto&quot;,&quot;Orgullo y rivalidad con Cristo&quot;,&quot;Lucifer; Cristo&quot;,&quot;El deseo de exaltación crece gradualmente; Lucifer aspira a honor y autoridad que las fuentes atribuyen a Cristo.&quot;,&quot;PP 35.2–35.3; SR 13.1–14.1; Isaías 14:12–14; Ezequiel 28:15–17&quot;,&quot;No se proporciona duración de esta transformación.&quot;],[&quot;Antes de la rebelión abierta&quot;,&quot;Amonestaciones y reunión celestial&quot;,&quot;Padre; Hijo; Lucifer; ángeles leales&quot;,&quot;Los ángeles y el Hijo amonestan a Lucifer; el Padre declara la posición del Hijo ante la asamblea celestial. Lucifer se inclina exteriormente, pero persiste la rivalidad.&quot;,&quot;PP 35.3–36.3; SR 13.2–15.2&quot;,&quot;PP 38.1 aclara que la autoridad de Cristo no había cambiado. No representar esta reunión como comienzo de su existencia o divinidad.&quot;],[&quot;Desarrollo de la rebelión&quot;,&quot;Difusión del descontento&quot;,&quot;Lucifer; ángeles bajo su influencia&quot;,&quot;Se cuestiona la necesidad de la ley; se promete libertad y se presenta la propia ambición como defensa del bien común.&quot;,&quot;PP 37.1–38.3; SR 14.2–16.1&quot;,&quot;Distinguir las acusaciones del personaje de las afirmaciones del narrador.&quot;],[&quot;Antes de la decisión definitiva&quot;,&quot;Posibilidad de retorno rechazada&quot;,&quot;Lucifer; Dios; ángeles leales&quot;,&quot;PP afirma que Lucifer fue convencido de su error y estuvo cerca de volver; el orgullo impidió la confesión. La paciencia divina se reinterpretó como debilidad.&quot;,&quot;PP 39.1–39.2&quot;,&quot;Esta oportunidad precede al estado posterior de rebelión irrevocable descrito en SR 26.1–27.1.&quot;],[&quot;Rebelión abierta&quot;,&quot;Ruptura y adhesiones&quot;,&quot;Satanás; simpatizantes; ángeles leales&quot;,&quot;Lucifer rechaza la supremacía del Hijo y persuade a sus seguidores de que ya no pueden ser perdonados. SR describe casi la mitad de los ángeles como simpatizantes en una fase del conflicto.&quot;,&quot;PP 40.1–41.1; SR 16.2–18.1&quot;,&quot;Apocalipsis 12:4 menciona un tercio de las estrellas. No convertir ambas expresiones en un mismo censo ni inventar el número de ángeles.&quot;],[&quot;Antes de la creación humana, según SR&quot;,&quot;Guerra y expulsión&quot;,&quot;Hijo de Dios; ángeles leales; Satanás; rebeldes&quot;,&quot;SR narra el conflicto, la victoria del Hijo y sus ángeles y la expulsión de Satanás y sus seguidores; después introduce la ejecución del propósito de crear al ser humano.&quot;,&quot;SR 19.1–19.2; PP 42.3; Apocalipsis 12:7–9&quot;,&quot;Apocalipsis nombra a Miguel; SR nombra al Hijo. La correspondencia pertenece al marco interpretativo de estas obras. La visión de Apocalipsis 12 no debe leerse entera como una secuencia anterior a Génesis.&quot;],[&quot;Después de la expulsión&quot;,&quot;Persistencia del conflicto&quot;,&quot;Dios; Satanás; seres creados&quot;,&quot;PP explica por qué no se destruye inmediatamente a Satanás: sus principios y consecuencias deben manifestarse. La expulsión no equivale a su destrucción final.&quot;,&quot;PP 41.2–43.1; SR 24.3–27.2&quot;,&quot;No añadir aquí un período de años ni la destrucción definitiva del mal, posterior al límite de esta línea.&quot;]]},{&quot;nombre&quot;:&quot;Creación, Edén y caída humana&quot;,&quot;periodo&quot;:&quot;Semana de creación y etapa edénica; sin año a. C. impuesto&quot;,&quot;eventos&quot;:[[&quot;Día 1&quot;,&quot;Luz y separación de oscuridad&quot;,&quot;Dios; Espíritu de Dios&quot;,&quot;Génesis inicia con la creación de cielos y tierra, la condición descrita de la tierra, las aguas y el movimiento del Espíritu; luego la luz, su separación de la oscuridad y los nombres día y noche.&quot;,&quot;Génesis 1:1–5&quot;,&quot;No asignar una duración independiente a Génesis 1:1–2 ni una fecha absoluta sin justificar el modelo.&quot;],[&quot;Día 2&quot;,&quot;Firmamento y aguas&quot;,&quot;Dios&quot;,&quot;Se establece el firmamento que separa las aguas y recibe el nombre Heaven en la KJV.&quot;,&quot;Génesis 1:6–8&quot;,&quot;Conservar el vocabulario de la versión; no añadir una reconstrucción física no expresada.&quot;],[&quot;Día 3&quot;,&quot;Tierra, mares y vegetación&quot;,&quot;Dios&quot;,&quot;Aparece la tierra seca; las aguas se reúnen; surgen hierba, plantas con semilla y árboles frutales según su especie.&quot;,&quot;Génesis 1:9–13&quot;,&quot;La vegetación precede a la colocación de las luminarias en la secuencia narrada.&quot;],[&quot;Día 4&quot;,&quot;Luminarias&quot;,&quot;Dios&quot;,&quot;Se describen dos grandes luminarias y las estrellas, para alumbrar, separar día y noche y señalar tiempos, días y años.&quot;,&quot;Génesis 1:14–19&quot;,&quot;No fechar aquí toda la historia del universo a partir de una inferencia no desarrollada.&quot;],[&quot;Día 5&quot;,&quot;Animales acuáticos y aves&quot;,&quot;Dios; criaturas acuáticas; aves&quot;,&quot;Creación de seres acuáticos y aves; bendición de fecundidad y multiplicación.&quot;,&quot;Génesis 1:20–23&quot;,&quot;Mantener separadas creación y bendición.&quot;],[&quot;Día 6&quot;,&quot;Animales terrestres y humanidad&quot;,&quot;Dios; Adán; Eva&quot;,&quot;Creación de animales terrestres y del ser humano, varón y mujer, a imagen divina; dominio, fecundidad y provisión alimentaria.&quot;,&quot;Génesis 1:24–31; PP 44.3–45.3; SR 20.2&quot;,&quot;La estatura excepcional y la vestidura de luz pertenecen a PP/SR; no aparecen como medidas o vestiduras explícitas en Génesis 1.&quot;],[&quot;Detalle de la creación humana&quot;,&quot;Formación, jardín y matrimonio&quot;,&quot;Dios; Adán; Eva&quot;,&quot;Polvo y aliento de vida; jardín, cuatro ríos y dos árboles destacados; trabajo de cuidado, mandato, animales nombrados y formación de la mujer. Unión conyugal y desnudez sin vergüenza.&quot;,&quot;Génesis 2:4–25; PP 46.1–46.4; 49.3–50.3&quot;,&quot;Génesis 2 desarrolla la escena humana; no se presenta aquí como una segunda semana posterior al reposo.&quot;],[&quot;Día 7&quot;,&quot;Reposo, bendición y santificación&quot;,&quot;Dios; primera pareja en el marco de PP&quot;,&quot;Terminación de la obra creadora; Dios reposa, bendice y santifica el séptimo día. PP lo presenta como memorial dado a la humanidad.&quot;,&quot;Génesis 2:1–3; PP 47.1–48.3&quot;,&quot;El texto no fija aquí una fecha del calendario moderno.&quot;],[&quot;Vida en Edén&quot;,&quot;Prueba de lealtad y plan del tentador&quot;,&quot;Adán; Eva; Satanás; ángeles&quot;,&quot;El mandato limita el acceso al árbol del conocimiento. SR describe el intento de Satanás de recuperar su posición, su rechazo y su plan de engañar a la pareja.&quot;,&quot;Génesis 2:16–17; SR 24.1–29.1&quot;,&quot;La petición de retorno, los motivos y el consejo de ángeles caídos son detalles de SR, no episodios narrados en Génesis.&quot;],[&quot;Caída humana&quot;,&quot;Engaño y desobediencia&quot;,&quot;Serpiente; Eva; Adán&quot;,&quot;Pregunta de la serpiente, respuesta de Eva, negación de la muerte, deseo del fruto y participación de ambos. Siguen desnudez consciente, hojas de higuera y ocultamiento.&quot;,&quot;Génesis 3:1–8&quot;,&quot;No se identifica el fruto como manzana. La prohibición de tocar figura en Génesis 3:3 y también se atribuye a Dios en SR 24.1; el mandato de Génesis 2:16–17 no incluye esa cláusula.&quot;],[&quot;Después de comer&quot;,&quot;Interrogación y anuncio de consecuencias&quot;,&quot;Dios; Adán; Eva; serpiente&quot;,&quot;Dios interroga; los personajes responden; se anuncian consecuencias diferenciadas, enemistad entre descendencias y retorno del hombre al polvo.&quot;,&quot;Génesis 3:9–19&quot;,&quot;La lectura cristológica de 3:15 debe identificarse como interpretación mesiánica, no como un nombre de Jesús escrito en el versículo.&quot;],[&quot;Salida de Edén&quot;,&quot;Vestiduras y acceso restringido al árbol de vida&quot;,&quot;Dios; Adán; Eva; querubines&quot;,&quot;Adán da el nombre Eva; Dios viste a la pareja; siguen expulsión, labor fuera del jardín y vigilancia del camino al árbol de vida.&quot;,&quot;Génesis 3:20–24&quot;,&quot;No se da la edad de Adán al caer ni el tiempo vivido sin pecado.&quot;]]},{&quot;nombre&quot;:&quot;Primeras generaciones y diluvio&quot;,&quot;periodo&quot;:&quot;Cronología relativa de Génesis 4–9&quot;,&quot;eventos&quot;:[[&quot;Después de Edén&quot;,&quot;Caín y Abel&quot;,&quot;Adán; Eva; Caín; Abel&quot;,&quot;Nacimiento, oficios, ofrendas, advertencia a Caín, homicidio, interrogación y sentencia; señal protectora y establecimiento en Nod.&quot;,&quot;Génesis 4:1–16&quot;,&quot;La forma de la señal y el nombre de la esposa de Caín no se especifican.&quot;],[&quot;Rama de Caín&quot;,&quot;Ciudad y desarrollo de actividades&quot;,&quot;Caín; Enoc; Irad; Mehujael; Metusael; Lamec; Ada; Zila; Jabal; Jubal; Tubal-caín; Naama&quot;,&quot;Se nombra una ciudad por Enoc y se describen ganadería, instrumentos y
